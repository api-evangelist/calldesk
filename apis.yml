aid: calldesk
name: CallDesk
description: >-
  Calldesk (calldesk.ai) is a French-founded, EU-focused provider of AI voice
  agents that automate inbound and outbound customer-service phone calls for
  enterprise contact centers. Its cloud platform designs, deploys, and monitors
  custom LLM-driven callbots that qualify, identify, and route callers, answer
  FAQs, create tickets, and transfer to human agents with summaries, speaking
  80+ languages and integrating with existing SIP/telephony stacks and CRM/help-desk
  tools such as Salesforce and Zendesk. Calldesk processes tens of millions of
  calls per year for enterprises across insurance, energy, banking, retail,
  logistics, travel, and auto-leasing, marketing outcomes such as up to 80%
  call automation and up to 50% cost reduction. Integrations are delivered via
  a REST API and data export (sFTP data lake); there is no public developer
  portal or OpenAPI. Added to the API Evangelist network as a point-nine
  portfolio company.
